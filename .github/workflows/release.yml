name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Verify tag matches plugin version
        run: |
          python -c "
          import json, os, sys
          version = json.load(open('mcdreforged.plugin.json', encoding='utf8'))['version']
          tag = os.environ['GITHUB_REF_NAME']
          tag_version = tag[1:] if tag.startswith('v') else tag
          if tag_version != version:
              sys.exit(f'tag {tag} does not match plugin version {version}')
          "
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -m "not e2e"
      - name: Pack plugin
        run: python -m mcdreforged pack -i . -o build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/*.mcdr --title "${GITHUB_REF_NAME}" --generate-notes
