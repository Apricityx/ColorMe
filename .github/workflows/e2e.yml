name: E2E

on:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Minecraft ${{ matrix.mc-version }} (${{ matrix.mcdr-language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc-version: '1.12.2'
            java-version: '8'
            mcdr-language: 'zh_cn'
          - mc-version: '1.20.4'
            java-version: '17'
            mcdr-language: 'en_us'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/js/package-lock.json
      - name: Prepare server cache directory
        run: mkdir -p tests/e2e/.cache
      - name: Cache Minecraft server jar
        uses: actions/cache@v4
        with:
          path: tests/e2e/.cache
          key: minecraft-server-${{ matrix.mc-version }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install bot dependencies
        run: npm ci
        working-directory: tests/e2e/js
      - name: Run end-to-end tests
        env:
          MCDR_E2E: '1'
          MC_VERSION: ${{ matrix.mc-version }}
          MCDR_E2E_LANGUAGE: ${{ matrix.mcdr-language }}
        run: pytest tests/e2e -q
